[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gnc-propsplit"
version = "0.1.0"
description = "Saisie GnuCash avec auto-complétion proportionnelle des transactions réparties"
requires-python = ">=3.11"
# Les bindings GnuCash (module `gnucash`) ne sont pas sur PyPI : ils viennent
# de l'installation de GnuCash (voir flake.nix).
dependencies = ["prompt_toolkit>=3", "tomli-w>=1"]

[project.scripts]
gnc-propsplit = "propsplit.cli:main"

[tool.setuptools]
packages = ["propsplit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
